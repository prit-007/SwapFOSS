<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SwapFOSS — batch export</title>
<meta name="description" content="Download post-ready bundles of free, open-source alternative cards." />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="brand">Swap<span>FOSS</span></div>
    <nav class="site-nav">
      <a href="https://github.com/prit-007/SwapFOSS" target="_blank" rel="noopener">GitHub</a>
      <a href="index.html">Home</a>
      <a href="create.html">Create</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>Batch export</h1>
    <p>Download post-ready bundles — intro card, tool cards, and outro — as a ZIP. Enter the PIN to unlock downloads.</p>
    <a href="create.html" class="batch-create-link">+ Create a new post</a>
  </div>
</section>

<main class="wrap" id="posts-section">
  <div class="posts-grid" id="posts-grid" aria-busy="true">
    <div class="skeleton-card skeleton-post" aria-hidden="true">
      <div class="skeleton skeleton-line" style="width:60%"></div>
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton-row">
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
      </div>
      <div class="skeleton skeleton-line" style="width:100%"></div>
      <div class="skeleton skeleton-btn"></div>
      <div class="skeleton skeleton-btn"></div>
    </div>
    <div class="skeleton-card skeleton-post" aria-hidden="true">
      <div class="skeleton skeleton-line" style="width:60%"></div>
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton-row">
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
      </div>
      <div class="skeleton skeleton-line" style="width:100%"></div>
      <div class="skeleton skeleton-btn"></div>
      <div class="skeleton skeleton-btn"></div>
    </div>
    <div class="skeleton-card skeleton-post" aria-hidden="true">
      <div class="skeleton skeleton-line" style="width:60%"></div>
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton-row">
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
      </div>
      <div class="skeleton skeleton-line" style="width:100%"></div>
      <div class="skeleton skeleton-btn"></div>
      <div class="skeleton skeleton-btn"></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    Built for sharing free software with the world.
  </div>
</footer>

<script type="module" src="js/batch-page.js"></script>
</body>
</html>
