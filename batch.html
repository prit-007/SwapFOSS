<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SwapFOSS — batch export</title>
<meta name="description" content="Download post-ready bundles of free, open-source alternative cards." />
<meta name="theme-color" content="#0F1115" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="SwapFOSS" />
<meta property="og:title" content="SwapFOSS — batch export" />
<meta property="og:description" content="Download post-ready carousel bundles — intro, tool cards, and outro as a ZIP." />
<meta property="og:url" content="https://prit-007.github.io/SwapFOSS/batch.html" />
<meta property="og:image" content="https://prit-007.github.io/SwapFOSS/assets/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="SwapFOSS — batch export" />
<meta name="twitter:description" content="Download post-ready carousel bundles as a ZIP." />
<meta name="twitter:image" content="https://prit-007.github.io/SwapFOSS/assets/og-image.png" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<a class="skip-link" href="#posts-section">Skip to content</a>

<header class="site-header">
  <div class="wrap">
    <div class="brand">Swap<span>FOSS</span></div>
    <nav class="site-nav">
      <a href="https://github.com/prit-007/SwapFOSS" target="_blank" rel="noopener">GitHub</a>
      <a href="index.html">Home</a>
      <a href="batch.html" aria-current="page">Batch export</a>
      <a href="create.html">Create</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <h1>Batch export</h1>
    <p>Download post-ready bundles — intro card, tool cards, and outro — as a ZIP. Enter the PIN to unlock downloads.</p>
    <a href="create.html" class="batch-create-link">+ Create a new post</a>
  </div>
</section>

<main class="wrap" id="posts-section" tabindex="-1">
  <div class="batch-bulk-bar" id="bulk-bar" hidden>
    <span class="batch-bulk-title">Apply to all posts</span>
    <select class="batch-select batch-bulk-select" id="bulk-preset" aria-label="Preset for every post">
      <option value="linkedin">LinkedIn (1080×1350)</option>
      <option value="instagram">Instagram (1080×1080)</option>
      <option value="twitter">Twitter / X (1200×675)</option>
    </select>
    <button class="batch-theme-toggle" id="bulk-theme" type="button" aria-pressed="false">
      <span class="batch-theme-icon">◐</span> Light
    </button>
    <label class="batch-bulk-check">
      <input type="checkbox" id="bulk-pin-remember" />
      Fill PIN for this session
    </label>
  </div>
  <div class="posts-grid" id="posts-grid" aria-busy="true">
    <div class="skeleton-card skeleton-post" aria-hidden="true">
      <div class="skeleton skeleton-line" style="width:60%"></div>
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton-row">
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
      </div>
      <div class="skeleton skeleton-line" style="width:100%"></div>
      <div class="skeleton skeleton-btn"></div>
      <div class="skeleton skeleton-btn"></div>
    </div>
    <div class="skeleton-card skeleton-post" aria-hidden="true">
      <div class="skeleton skeleton-line" style="width:60%"></div>
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton-row">
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
      </div>
      <div class="skeleton skeleton-line" style="width:100%"></div>
      <div class="skeleton skeleton-btn"></div>
      <div class="skeleton skeleton-btn"></div>
    </div>
    <div class="skeleton-card skeleton-post" aria-hidden="true">
      <div class="skeleton skeleton-line" style="width:60%"></div>
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton-row">
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
        <span class="skeleton skeleton-dot"></span>
      </div>
      <div class="skeleton skeleton-line" style="width:100%"></div>
      <div class="skeleton skeleton-btn"></div>
      <div class="skeleton skeleton-btn"></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    Built for sharing free software with the world.
  </div>
</footer>

<script type="module" src="js/batch-page.js"></script>
</body>
</html>
