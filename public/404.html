<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SwapFOSS — redirecting…</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/SwapFOSS/favicon.svg" />
<script>
  // GitHub Pages SPA fallback: serve this file for any unknown path and
  // redirect to index.html with the route preserved as a query (?/route&query),
  // which index.html decodes back into a clean history-mode URL.
  (function () {
    var segmentCount = 1; // path segments before the app route (/SwapFOSS/)
    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + segmentCount).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
    );
  })();
</script>
</head>
<body>
  <p>One moment — taking you to SwapFOSS…</p>
  <noscript>This site needs JavaScript enabled. <a href="/SwapFOSS/">Go to the homepage</a>.</noscript>
</body>
</html>
