<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SwapFOSS — slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
<style>
  body { margin: 0; background: var(--bg); }

  /* ── Shared intro / outro base ── */
  .export-card.intro, .export-card.outro {
    justify-content: flex-start;
    align-items: center;
    text-align: center;
    padding: 64px;
    position: relative;
    overflow: hidden;
  }

  /* ── 1. Glowing Mesh Gradient ── */
  .export-card.intro {
    background-color: #0f172a;
    background-image:
      radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.18), transparent 50%),
      radial-gradient(circle at 85% 30%, rgba(239, 68, 68, 0.15), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.10), transparent 45%);
  }
  .export-card.outro {
    background-color: #0f172a;
    background-image:
      radial-gradient(circle at 80% 60%, rgba(99, 102, 241, 0.18), transparent 50%),
      radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15), transparent 50%),
      radial-gradient(circle at 50% 10%, rgba(168, 85, 247, 0.10), transparent 45%);
  }

  /* ── 2. Blueprint Grid Pattern ── */
  .export-card.intro::before, .export-card.outro::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── 3. Watermark Typography ── */
  .watermark-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font-display);
    font-size: 280px;
    font-weight: 800;
    color: rgba(255, 255, 255, 0.025);
    z-index: 0;
    pointer-events: none;
    letter-spacing: -0.04em;
    white-space: nowrap;
  }

  /* ── Content layers (above grid + watermark) ── */
  .brandmark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    position: relative;
    z-index: 2;
  }
  .brandmark span { color: var(--media); }

  .intro-content, .outro-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    position: relative;
    z-index: 2;
    margin-top: auto;
    margin-bottom: auto;
    max-width: 700px;
  }

  .eyebrow {
    font-size: 16px;
    color: rgba(255,255,255,0.45);
    font-family: var(--font-body);
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    position: relative;
    z-index: 2;
  }

  .intro h1, .outro h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 52px;
    line-height: 1.1;
    margin: 0;
    max-width: 15ch;
    position: relative;
    z-index: 2;
    color: #F5F3ED;
  }

  .intro h1 .hl, .outro h1 .hl {
    background: linear-gradient(135deg, #FF5A5F 0%, #FFC857 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .outro h1 .hl-blue {
    background: linear-gradient(135deg, #4EA8DE 0%, #B983FF 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .intro p, .outro p {
    font-size: 20px;
    color: rgba(255,255,255,0.55);
    max-width: 30ch;
    margin: 0;
    position: relative;
    z-index: 2;
    line-height: 1.5;
  }

  /* ── 4. Floating App Icons (Intro) ── */
  .intro-float-icons {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .intro-float-icon {
    position: absolute;
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 10px;
    object-fit: contain;
    filter: blur(1.5px);
    opacity: 0.4;
    transition: transform 0.6s ease;
  }
  .intro-float-icon:nth-child(1) { top: 12%; left: 8%; transform: rotate(-8deg); }
  .intro-float-icon:nth-child(2) { top: 18%; right: 10%; transform: rotate(5deg); }
  .intro-float-icon:nth-child(3) { bottom: 22%; left: 12%; transform: rotate(12deg); }
  .intro-float-icon:nth-child(4) { bottom: 15%; right: 8%; transform: rotate(-6deg); }

  /* ── Outro CTA + dots ── */
  .outro-cta {
    margin-top: 8px;
    padding: 16px 36px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.15);
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 600;
    color: #F5F3ED;
    background: rgba(255,255,255,0.06);
    position: relative;
    z-index: 2;
    cursor: default;
    transition: background 0.2s ease;
    white-space: nowrap;
  }

  .outro-dots {
    position: absolute;
    bottom: 56px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 2;
  }
  .outro-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
  }
  .outro-dot.active {
    background: #4EA8DE;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <script src="js/slide.js"></script>
</body>
</html>
