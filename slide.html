<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SwapFOSS — slide</title>
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  body { margin: 0; background: var(--bg); }

  /* ── Shared intro / outro base ── */
  .export-card.intro, .export-card.outro {
    justify-content: flex-start;
    align-items: center;
    text-align: center;
    padding: 64px;
    position: relative;
    overflow: hidden;
  }

  /* ── 1. Glowing Mesh Gradient ── */
  .export-card.intro {
    background-color: #0f172a;
    background-image:
      radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.24), transparent 50%),
      radial-gradient(circle at 85% 30%, rgba(239, 68, 68, 0.20), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.14), transparent 45%);
  }
  .export-card.outro {
    background-color: #0f172a;
    background-image:
      radial-gradient(circle at 80% 60%, rgba(99, 102, 241, 0.24), transparent 50%),
      radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.20), transparent 50%),
      radial-gradient(circle at 50% 10%, rgba(168, 85, 247, 0.14), transparent 45%);
  }

  /* ── 2. Blueprint Grid Pattern ── */
  .export-card.intro::before, .export-card.outro::before {
    display: none;
  }
  .card-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── 2b. Film grain + vignette (immersive depth) ── */
  .card-noise, .card-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .card-noise {
    background: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27300%27%20height=%27300%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%270.85%27%20numOctaves=%274%27%20stitchTiles=%27stitch%27/%3E%3CfeColorMatrix%20type=%27saturate%27%20values=%270%27/%3E%3C/filter%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20filter=%27url(%23n)%27/%3E%3C/svg%3E");
    opacity: 0.14;
    mix-blend-mode: overlay;
  }
  .card-vignette {
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.45) 100%);
  }

  /* ── 3. Watermark Typography — outlined ── */
  .watermark-bg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--font-display);
    font-size: 320px;
    font-weight: 700;
    color: transparent;
    -webkit-text-stroke: 2px rgba(255, 255, 255, 0.07);
    z-index: 0;
    pointer-events: none;
    letter-spacing: -0.04em;
    white-space: nowrap;
  }

  /* ── Top bar: brand + slide counter ── */
  .card-topbar {
    position: absolute;
    top: 56px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 3;
  }
  .slide-counter {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.42);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── Content layers (above grid + watermark) ── */
  .brandmark {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.02em;
    position: relative;
    z-index: 2;
  }
  .brandmark span { color: var(--media); }
  .outro .brandmark span { color: #4EA8DE; }

  .intro-content, .outro-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    position: relative;
    z-index: 2;
    margin-top: auto;
    margin-bottom: auto;
    max-width: 760px;
  }

  /* ── Mono eyebrow chip ── */
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #FF8A8E;
    background: rgba(255, 90, 95, 0.10);
    border: 1px solid rgba(255, 90, 95, 0.45);
    padding: 11px 24px;
    border-radius: 999px;
    position: relative;
    z-index: 2;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .intro h1, .outro h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 80px;
    line-height: 1.08;
    margin: 0;
    max-width: 15ch;
    position: relative;
    z-index: 2;
    color: #F5F3ED;
    letter-spacing: -0.025em;
  }

  .intro h1 .hl, .outro h1 .hl {
    background: linear-gradient(135deg, #FF5A5F 0%, #FFC857 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .outro h1 .hl-blue {
    background: linear-gradient(135deg, #4EA8DE 0%, #B983FF 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .intro p, .outro p {
    font-family: var(--font-body);
    font-size: 26px;
    color: rgba(255,255,255,0.60);
    max-width: 34ch;
    margin: 0;
    position: relative;
    z-index: 2;
    line-height: 1.5;
  }

  /* ── Bento stat pills (intro) ── */
  .intro-stats-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 8px;
    position: relative;
    z-index: 2;
  }
  .stat-pill {
    font-family: var(--font-mono);
    font-size: 16px;
    color: #d1d5db;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 9px 18px;
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    white-space: nowrap;
  }

  /* ── 4. Floating App Icons (Intro) ── */
  .intro-float-icons {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }
  .intro-float-icon {
    position: absolute;
    width: 76px;
    height: 76px;
    object-fit: contain;
    filter: blur(1.5px) drop-shadow(0 16px 32px rgba(0,0,0,0.5));
    opacity: 0.65;
    transition: transform 0.6s ease;
  }
  .intro-float-icon:nth-child(1) { top: 12%; left: 8%; transform: rotate(-8deg); }
  .intro-float-icon:nth-child(2) { top: 18%; right: 10%; transform: rotate(5deg); }
  .intro-float-icon:nth-child(3) { bottom: 22%; left: 12%; transform: rotate(12deg); }
  .intro-float-icon:nth-child(4) { bottom: 15%; right: 8%; transform: rotate(-6deg); }

  /* ── Outro CTA + dots ── */
  .outro-cta {
    margin-top: 8px;
    padding: 20px 44px;
    border-radius: 999px;
    border: none;
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #ffffff;
    background: linear-gradient(135deg, #4EA8DE 0%, #B983FF 100%);
    box-shadow: 0 12px 40px rgba(78, 168, 222, 0.35);
    position: relative;
    z-index: 2;
    cursor: default;
    white-space: nowrap !important;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
  }

  .outro-url {
    font-family: var(--font-mono);
    font-size: 16px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.42);
    position: relative;
    z-index: 2;
  }

  .swipe-hint {
    position: absolute;
    bottom: 48px;
    left: 0;
    right: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 17px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.8);
  }
  .swipe-hint::before,
  .swipe-hint::after {
    content: "";
    display: block;
    width: 40px;
    height: 2px;
  }
  .swipe-hint::before {
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5));
  }
  .swipe-hint::after {
    background: linear-gradient(-90deg, transparent, rgba(255,255,255,0.5));
  }

  .outro-dots {
    position: absolute;
    bottom: 56px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 2;
  }
  .outro-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
  }
  .outro-dot.active {
    background: #4EA8DE;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <script type="module" src="js/slide.js"></script>
</body>
</html>
