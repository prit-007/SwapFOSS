<script>
  // Decode the 404.html SPA redirect (pathname "/SwapFOSS/?/route&query") back
  // into a clean history-mode URL before the app boots. l.pathname always ends
  // with "/" here, so slice(0, -1) preserves the subpath base.
  (function (l) {
    if (l.search[1] === "/") {
      var decoded = l.search
        .slice(1)
        .split("&")
        .map(function (s) {
          return s.replace(/~and~/g, "&");
        })
        .join("?");
      window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
    }
  })(window.location);
</script>
